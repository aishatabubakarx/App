          package com.siteguard;

          import android.content.Context;
          import android.graphics.Typeface;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.Calendar;

          /** Words shown on the morning screen and on the prayer alarms. Edit freely. */
          final class Content {
              private Content() { }

              static final int MORNING = 0;
              static final int TAHAJJUD = 1;
              static final int FAJR = 2;

              // Meanings of hadith, each with its reference. Please check these against your own books.
              static final String[][] HADITH = {
                  {"No tiredness, illness, worry, sadness, harm or distress touches a believer, not even a thorn that pricks him, except that Allah removes some of his sins because of it.", "Bukhari 5641, Muslim 2573"},
                  {"How wonderful is the situation of the believer, all of it is good for him. If something good happens he is grateful, and that is good for him. If something harmful happens he is patient, and that is good for him.", "Muslim 2999"},
                  {"Allah the Exalted says: I am as My servant expects Me to be, and I am with him when he remembers Me.", "Bukhari 7405, Muslim 2675"},
                  {"The greatest reward comes with the greatest trial. When Allah loves a people, He tests them. Whoever is pleased with it earns His pleasure.", "Tirmidhi 2396, graded hasan"},
                  {"When Allah wants good for someone, He lets him go through trials.", "Bukhari 5645"},
                  {"The strong believer is better and more beloved to Allah than the weak believer, though both have good. Hold on to what benefits you, ask Allah for help, and do not give up. If something hits you, do not say 'if only I had done this', but say: Allah decreed it, and what He wills, He does.", "Muslim 2664"},
                  {"Be mindful of Allah and He will protect you. Be mindful of Allah and you will find Him in front of you. If you ask, ask Allah. If you seek help, seek help from Allah.", "Tirmidhi 2516, graded hasan sahih"},
                  {"Every son of Adam makes mistakes, and the best of those who make mistakes are those who turn back to Allah.", "Tirmidhi 2499, graded hasan"},
                  {"Allah is more merciful to His servants than this mother is to her child.", "Bukhari 5999, Muslim 2754"},
              };

              static final String[][] TAHAJJUD_HADITH = {
                  {"Our Lord descends every night to the lowest heaven when the last third of the night remains. He says: Who is calling on Me, so I may answer him? Who is asking Me, so I may give him? Who is asking My forgiveness, so I may forgive him?", "Bukhari 1145, Muslim 758"},
              };

              static final String[][] FAJR_HADITH = {
                  {"Whoever prays Fajr is under the protection of Allah.", "Muslim 657"},
                  {"The two rak'ahs of Fajr are better than this world and everything in it.", "Muslim 725"},
              };

              static final String[] AYAH = {
                  "Verily, in the remembrance of Allah do hearts find rest. (Quran 13:28)",
                  "Indeed, with hardship comes ease. Indeed, with hardship comes ease. (Quran 94:5-6)",
                  "Allah does not burden a soul beyond what it can bear. (Quran 2:286)",
                  "Do not despair of the mercy of Allah. Indeed, Allah forgives all sins. (Quran 39:53)",
                  "So remember Me, and I will remember you. (Quran 2:152)",
                  "Your Lord has not abandoned you, nor has He detested you. (Quran 93:3, said to the Prophet, peace be upon him)",
                  "And whoever relies on Allah, He is enough for him. (Quran 65:3)",
                  "And He is with you wherever you are. (Quran 57:4)",
              };

              static final String[] AFFIRM = {
                  "You are allowed to be a work in progress and still be loved.",
                  "Small steps still count. Showing up is already a win.",
                  "You have gotten through every hard day you have had so far. That is a perfect record.",
                  "Your worth was never tied to how productive or perfect you are.",
                  "Be as gentle with yourself as you would be with a friend in your place.",
                  "Good things are being built in you, slowly and quietly.",
                  "Peace is not something you earn at the end of a good day. You can take some of it right now.",
                  "You are capable of more than your worst day made you believe.",
                  "Your effort matters, even when nobody sees it.",
                  "Pick one thing today and do it well. That is enough.",
                  "Success is made of the small habits you keep on ordinary days like today.",
                  "You are doing better than you think you are.",
                  "Whatever happened yesterday, today is a clean page.",
                  "A calm mind, a steady heart, one small next step.",
                  "You are not behind. You are on your own road, at your own pace.",
                  "Wanting to grow is already a sign that you are growing.",
                  "You deserve rest, and you deserve good things too.",
                  "Your mistakes do not cancel your effort. Try again, softly.",
              };

              static final String[] STORY = {
                  "Prophet Ayyub (peace be upon him) lost his health and his comfort for years. He said, \"Adversity has touched me, and You are the Most Merciful of those who show mercy\" (21:83). Allah restored him and called him an excellent servant (38:44). His pain was never a sign that Allah had left him.",
                  "Prophet Yunus (peace be upon him) called out from the darkness of the night, the sea and the whale: \"There is no god but You, glory be to You, I was among the wrongdoers.\" Allah answered him and saved him (21:87-88). Even the darkest place was not outside of Allah's hearing.",
                  "Prophet Yaqub (peace be upon him) lost his son Yusuf and grieved so much that his eyes turned white (12:84). He still said, \"Beautiful patience\" and \"I only complain of my sorrow and grief to Allah\" (12:83, 12:86). Years later he was reunited with his sons.",
                  "Prophet Yusuf (peace be upon him) was thrown into a well by his own brothers, sold, falsely accused and jailed for years. Allah raised him to a place of honour (Surah Yusuf). The long road was part of the story, not the end of it.",
                  "The Prophet (peace be upon him) went to Ta'if and was turned away and mocked. When the angel of the mountains offered to crush the town between two mountains, he refused, hoping Allah would bring believers from among them (Bukhari 3231). He carried more than most of us ever will, and Allah's love for him never changed.",
                  "Maryam (peace be upon her) was alone and in pain, and Allah comforted her: \"Do not grieve, your Lord has provided beneath you a stream\" (19:24). She was not forgotten in her hardest hour.",
              };

              static int dayNumber() {
                  return (int) (System.currentTimeMillis() / 86400000L);
              }

              // The "day" for the morning screen starts at 3 am, so a late night does not count as a new day.
              private static String dayKey() {
                  Calendar c = Calendar.getInstance();
                  c.add(Calendar.HOUR_OF_DAY, -3);
                  return c.get(Calendar.YEAR) + "-" + c.get(Calendar.DAY_OF_YEAR);
              }

              static boolean morningDue(Context c) {
                  return !dayKey().equals(c.getSharedPreferences("sg2", Context.MODE_PRIVATE).getString("morning", ""));
              }

              static void markMorning(Context c) {
                  c.getSharedPreferences("sg2", Context.MODE_PRIVATE).edit().putString("morning", dayKey()).apply();
              }

              // ---------- building the screen ----------

              private static int dp(Context c, int v) {
                  return (int) (v * c.getResources().getDisplayMetrics().density);
              }

              private static void title(Context c, LinearLayout body, String s) {
                  TextView t = new TextView(c);
                  t.setText(s);
                  t.setTextSize(26);
                  t.setTextColor(0xFFFFFFFF);
                  t.setTypeface(null, Typeface.BOLD);
                  t.setPadding(0, 0, 0, dp(c, 16));
                  body.addView(t);
              }

              private static void section(Context c, LinearLayout body, String head, String text, String ref) {
                  TextView h = new TextView(c);
                  h.setText(head);
                  h.setTextSize(13);
                  h.setTextColor(0xFF9FB4D0);
                  h.setTypeface(null, Typeface.BOLD);
                  h.setPadding(0, dp(c, 18), 0, dp(c, 4));
                  body.addView(h);
                  TextView t = new TextView(c);
                  t.setText(text);
                  t.setTextSize(18);
                  t.setTextColor(0xFFFFFFFF);
                  t.setLineSpacing(0f, 1.15f);
                  body.addView(t);
                  if (ref != null) {
                      TextView r = new TextView(c);
                      r.setText(ref);
                      r.setTextSize(14);
                      r.setTextColor(0xFF9FB4D0);
                      r.setPadding(0, dp(c, 4), 0, 0);
                      body.addView(r);
                  }
              }

              private static String pick(String[] a, int n) {
                  return a[Math.floorMod(n, a.length)];
              }

              private static String[] pick(String[][] a, int n) {
                  return a[Math.floorMod(n, a.length)];
              }

              static LinearLayout screen(Context c, int kind, View... bottom) {
                  LinearLayout outer = new LinearLayout(c);
                  outer.setOrientation(LinearLayout.VERTICAL);
                  outer.setBackgroundColor(0xFF0F1B2D);
                  outer.setPadding(dp(c, 20), dp(c, 48), dp(c, 20), dp(c, 20));

                  ScrollView sv = new ScrollView(c);
                  LinearLayout body = new LinearLayout(c);
                  body.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(body);
                  outer.addView(sv, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  int n = dayNumber();
                  if (kind == TAHAJJUD) {
                      String[] hd = pick(TAHAJJUD_HADITH, n);
                      title(c, body, "Time for Tahajjud");
                      section(c, body, "THE LAST THIRD OF THE NIGHT", hd[0], hd[1]);
                      section(c, body, "A KIND WORD", pick(AFFIRM, n + 3), null);
                      section(c, body, "REMEMBER ALLAH", pick(AYAH, n + 1), null);
                  } else if (kind == FAJR) {
                      String[] hd = pick(FAJR_HADITH, n);
                      title(c, body, "Wake up for Fajr");
                      section(c, body, "A REMINDER", hd[0], hd[1]);
                      section(c, body, "A KIND WORD", pick(AFFIRM, n + 5), null);
                      section(c, body, "REMEMBER ALLAH", pick(AYAH, n + 2), null);
                  } else {
                      String[] hd = pick(HADITH, n);
                      title(c, body, "Good morning. Bismillah.");
                      section(c, body, "A HADITH FOR YOU", hd[0], hd[1]);
                      section(c, body, "REMEMBER ALLAH", pick(AYAH, n), null);
                      section(c, body, "A KIND WORD", pick(AFFIRM, n) + "\n\n" + pick(AFFIRM, n + 7), null);
                      section(c, body, "YOU ARE NOT THE FIRST TO BE TESTED", pick(STORY, n), "Being tested is not the same as being unloved.");
                  }

                  for (View v : bottom) outer.addView(v);
                  return outer;
              }
          }

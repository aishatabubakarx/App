          package com.siteguard;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.util.Calendar;

          /** Daily time limit for Instagram and TikTok together. */
          final class Usage {
              private Usage() { }

              // Change this number to change the daily limit (hours x minutes x seconds x 1000).
              static final long LIMIT_MS = 2L * 60 * 60 * 1000;

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("sg2", Context.MODE_PRIVATE);
              }

              private static String today() {
                  Calendar c = Calendar.getInstance();
                  return c.get(Calendar.YEAR) + "-" + c.get(Calendar.DAY_OF_YEAR);
              }

              static long used(Context c) {
                  SharedPreferences sp = p(c);
                  if (!today().equals(sp.getString("use_day", ""))) return 0;
                  return sp.getLong("use_ms", 0);
              }

              static void add(Context c, long ms) {
                  long now = used(c) + ms;
                  p(c).edit().putString("use_day", today()).putLong("use_ms", now).apply();
              }

              static boolean exceeded(Context c) {
                  return used(c) >= LIMIT_MS;
              }

              static String describe(Context c) {
                  long u = used(c) / 60000;
                  long l = LIMIT_MS / 60000;
                  return "Instagram + TikTok today: " + (u / 60) + "h " + (u % 60) + "m of " + (l / 60) + "h " + (l % 60) + "m";
              }
          }

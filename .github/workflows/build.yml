          package com.siteguard;

          import android.app.Activity;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.Button;

          public class AlarmActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                          | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD);
                  final int kind = getIntent().getIntExtra("kind", Scheduler.TAHAJJUD);

                  Button up = new Button(this);
                  up.setText("I'm up");
                  up.setOnClickListener(v -> {
                      Scheduler.cancelRetry(this, kind);
                      stopRinging();
                      finish();
                  });
                  Button snooze = new Button(this);
                  snooze.setText("Snooze 5 minutes");
                  snooze.setOnClickListener(v -> {
                      Scheduler.cancelRetry(this, kind);
                      Scheduler.snooze(this, kind);
                      stopRinging();
                      finish();
                  });
                  setContentView(Content.screen(this, kind, up, snooze));
              }

              private void stopRinging() {
                  stopService(new Intent(this, AlarmService.class));
                  try {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      nm.cancel(4);
                  } catch (Exception ignored) { }
              }

              // The alarm cannot be dismissed with the back button. Tap "I'm up" or snooze.
              @Override
              public void onBackPressed() { }
          }

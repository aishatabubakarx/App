          package com.siteguard;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  String a = i.getAction();
                  int kind = i.getIntExtra("kind", Scheduler.TAHAJJUD);
                  if (Scheduler.ACT_NOTICE.equals(a)) {
                      Scheduler.showNotice(c);
                  } else if (Scheduler.ACT_RING.equals(a) || Scheduler.ACT_RETRY.equals(a)) {
                      // A fresh daily alarm starts the backup-ring count again.
                      if (Scheduler.ACT_RING.equals(a)) Scheduler.resetRetries(c, kind);
                      try {
                          Intent s = new Intent(c, AlarmService.class).putExtra("kind", kind);
                          if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s);
                          else c.startService(s);
                      } catch (Exception e) {
                          // If the phone refuses to start the alarm service, still make noise.
                          try { Scheduler.fallbackAlarm(c, kind); } catch (Exception ignored) { }
                          Scheduler.scheduleRetry(c, kind);
                      }
                  }
                  // Line up tomorrow's alarms.
                  Scheduler.scheduleAll(c);
              }
          }

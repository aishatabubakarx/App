          final class Scheduler {
              private Scheduler() { }

              static final int TAHAJJUD = 1;
              static final int FAJR = 2;
              static final int NOTICE = 3;

              static final String ACT_RING = "com.siteguard.RING";
              static final String ACT_NOTICE = "com.siteguard.NOTICE";
              static final String ACT_RETRY = "com.siteguard.RETRY";

              // Change these to move the alarms.
              static final int TAHAJJUD_H = 4, TAHAJJUD_M = 10;
              static final int FAJR_H = 5, FAJR_M = 20;
              // The reminder before a screen-time day goes out at this hour the evening before.
              static final int NOTICE_H = 20;

              static void scheduleAll(Context c) {
                  setRing(c, TAHAJJUD, next(TAHAJJUD_H, TAHAJJUD_M), TAHAJJUD, ACT_RING);
                  setRing(c, FAJR, next(FAJR_H, FAJR_M), FAJR, ACT_RING);
                  long n = nextNotice();
                  if (n > 0) setNotice(c, n);
              }

              static void snooze(Context c, int kind) {
                  setRing(c, kind, System.currentTimeMillis() + 5 * 60 * 1000L, 100 + kind, ACT_RING);
              }

              // While an alarm is ringing, a backup ring is lined up 3 minutes later. It is cancelled
              // when you tap "I'm up" or snooze, so if the first ring fails or you sleep through it,
              // it rings again, up to 6 more times.
              static void scheduleRetry(Context c, int kind) {
                  android.content.SharedPreferences p = c.getSharedPreferences("sg2", Context.MODE_PRIVATE);
                  int n = p.getInt("retry" + kind, 0);
                  if (n >= 6) return;
                  p.edit().putInt("retry" + kind, n + 1).apply();
                  setRing(c, kind, System.currentTimeMillis() + 3 * 60 * 1000L, 200 + kind, ACT_RETRY);
              }

              static void resetRetries(Context c, int kind) {
                  c.getSharedPreferences("sg2", Context.MODE_PRIVATE).edit().putInt("retry" + kind, 0).apply();
              }

              static void cancelRetry(Context c, int kind) {
                  resetRetries(c, kind);
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  am.cancel(pi(c, kind, 200 + kind, ACT_RETRY));
              }

              private static long next(int h, int m) {
                  Calendar t = Calendar.getInstance();
                  t.set(Calendar.HOUR_OF_DAY, h);
                  t.set(Calendar.MINUTE, m);
                  t.set(Calendar.SECOND, 0);
                  t.set(Calendar.MILLISECOND, 0);
                  if (t.getTimeInMillis() <= System.currentTimeMillis()) t.add(Calendar.DAY_OF_MONTH, 1);
                  return t.getTimeInMillis();
              }

              private static long nextNotice() {
                  Calendar d = Calendar.getInstance();
                  for (int i = 0; i < 70; i++) {
                      int dom = d.get(Calendar.DAY_OF_MONTH);
                      if (d.get(Calendar.DAY_OF_WEEK) == Calendar.SATURDAY && dom >= 8 && dom <= 14) {
                          Calendar n = (Calendar) d.clone();
                          n.add(Calendar.DAY_OF_MONTH, -1);
                          n.set(Calendar.HOUR_OF_DAY, NOTICE_H);
                          n.set(Calendar.MINUTE, 0);
                          n.set(Calendar.SECOND, 0);
                          n.set(Calendar.MILLISECOND, 0);
                          if (n.getTimeInMillis() > System.currentTimeMillis()) return n.getTimeInMillis();
                      }
                      d.add(Calendar.DAY_OF_MONTH, 1);
                  }
                  return -1;
              }

              private static PendingIntent pi(Context c, int kind, int req, String action) {

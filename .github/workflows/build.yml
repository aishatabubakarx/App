name: Build Site Guard APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write project files
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/siteguard app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle <<'SGEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SiteGuard"
          include ':app'
          SGEOF
          cat > build.gradle <<'SGEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          SGEOF
          cat > gradle.properties <<'SGEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          SGEOF
          cat > app/build.gradle <<'SGEOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.siteguard'
              compileSdk 34
              defaultConfig {
                  applicationId "com.siteguard"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false }
          }
          SGEOF
          cat > app/src/main/AndroidManifest.xml <<'SGEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GuardService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>

                  <receiver
                      android:name=".AdminReceiver"
                      android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin"/>
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>
                      </intent-filter>
                  </receiver>
                  <activity
                      android:name=".AlarmActivity"
                      android:exported="false"
                      android:launchMode="singleTask"
                      android:excludeFromRecents="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"/>

                  <service android:name=".AlarmService" android:exported="false"/>

                  <receiver android:name=".AlarmReceiver" android:exported="false"/>

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          SGEOF
          cat > app/src/main/res/values/strings.xml <<'SGEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Site Guard</string>
              <string name="accessibility_desc">Reads the screen to block listed sites and apps and to protect Site Guard from removal.</string>
          </resources>
          SGEOF
          cat > app/src/main/res/xml/accessibility_config.xml <<'SGEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/accessibility_desc"/>
          SGEOF
          cat > app/src/main/res/xml/device_admin.xml <<'SGEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          SGEOF
          cat > app/src/main/java/com/siteguard/AdminReceiver.java <<'SGEOF'
          package com.siteguard;

          import android.app.admin.DeviceAdminReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class AdminReceiver extends DeviceAdminReceiver {
              @Override
              public CharSequence onDisableRequested(Context context, Intent intent) {
                  return "Site Guard needs its PIN to be switched off.";
              }
          }
          SGEOF
          cat > app/src/main/java/com/siteguard/Store.java <<'SGEOF'
          package com.siteguard;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.util.Base64;

          import java.security.MessageDigest;
          import java.security.SecureRandom;

          import javax.crypto.SecretKeyFactory;
          import javax.crypto.spec.PBEKeySpec;

          public class Store {
              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("sg", Context.MODE_PRIVATE);
              }

              static boolean hasPin(Context c) { return p(c).contains("hash"); }
              static boolean armed(Context c) { return p(c).getBoolean("armed", false); }
              static void setArmed(Context c, boolean v) { p(c).edit().putBoolean("armed", v).apply(); }

              private static byte[] hash(String pin, byte[] salt) throws Exception {
                  PBEKeySpec spec = new PBEKeySpec(pin.toCharArray(), salt, 20000, 256);
                  return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA1").generateSecret(spec).getEncoded();
              }

              /** Creates a random 8-digit PIN, stores only a salted hash, returns the PIN once. */
              static String newPin(Context c) {
                  try {
                      SecureRandom r = new SecureRandom();
                      String pin = String.valueOf(10000000 + r.nextInt(90000000));
                      byte[] salt = new byte[16];
                      r.nextBytes(salt);
                      p(c).edit()
                          .putString("salt", Base64.encodeToString(salt, Base64.NO_WRAP))
                          .putString("hash", Base64.encodeToString(hash(pin, salt), Base64.NO_WRAP))
                          .putInt("fails", 0)
                          .putLong("lock", 0)
                          .apply();
                      return pin;
                  } catch (Exception e) {
                      throw new RuntimeException(e);
                  }
              }

              /** 0 = correct, 1 = wrong, 2 = temporarily locked after too many wrong tries. */
              static int check(Context c, String pin) {
                  long now = System.currentTimeMillis();
                  if (now < p(c).getLong("lock", 0)) return 2;
                  boolean ok = false;
                  try {
                      byte[] salt = Base64.decode(p(c).getString("salt", ""), Base64.NO_WRAP);
                      String h = Base64.encodeToString(hash(pin, salt), Base64.NO_WRAP);
                      ok = MessageDigest.isEqual(h.getBytes(), p(c).getString("hash", "").getBytes());
                  } catch (Exception ignored) { }
                  SharedPreferences.Editor ed = p(c).edit();
                  if (ok) {
                      ed.putInt("fails", 0).apply();
                      return 0;
                  }
                  int f = p(c).getInt("fails", 0) + 1;
                  if (f >= 3) ed.putInt("fails", 0).putLong("lock", now + 30L * 60 * 1000);
                  else ed.putInt("fails", f);
                  ed.apply();
                  return 1;
              }
          }
          SGEOF
          cat > app/src/main/java/com/siteguard/MainActivity.java <<'SGEOF'
          package com.siteguard;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private LinearLayout root;
              private String shownPin; // kept only in memory, never saved

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  ScrollView sv = new ScrollView(this);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(48, 48, 48, 48);
                  sv.addView(root);
                  setContentView(sv);
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  Scheduler.scheduleAll(this);
                  render();
              }

              private TextView text(String s, int sp, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setPadding(0, 16, 0, 16);
                  if (bold) t.setTypeface(null, android.graphics.Typeface.BOLD);
                  return t;
              }

              private Button button(String label, View.OnClickListener l) {
                  Button bt = new Button(this);
                  bt.setText(label);
                  bt.setOnClickListener(l);
                  return bt;
              }

              private boolean accessibilityOn() {
                  String s = Settings.Secure.getString(getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  return s != null && s.contains(getPackageName());
              }

              private void openAppInfo() {
                  Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                  i.setData(Uri.parse("package:" + getPackageName()));
                  startActivity(i);
              }

              private void alarmStatus() {
                  root.addView(text("Alarms: Tahajjud " + Scheduler.TAHAJJUD_H + ":" + String.format("%02d", Scheduler.TAHAJJUD_M) + " am, Fajr " + Scheduler.FAJR_H + ":" + String.format("%02d", Scheduler.FAJR_M) + " am.", 16, false));
                  root.addView(button("Test the alarm now", v -> {
                      Intent s = new Intent(this, AlarmService.class).putExtra("kind", Scheduler.FAJR);
                      if (android.os.Build.VERSION.SDK_INT >= 26) startForegroundService(s);
                      else startService(s);
                  }));
                  if (android.os.Build.VERSION.SDK_INT >= 31) {
                      android.app.AlarmManager am = (android.app.AlarmManager) getSystemService(ALARM_SERVICE);
                      if (!am.canScheduleExactAlarms()) {
                          root.addView(text("The prayer alarms need the Alarms and reminders permission.", 16, true));
                          root.addView(button("Allow alarms", v -> startActivity(new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse("package:" + getPackageName())))));
                      }
                  }
              }

              private ComponentName admin() { return new ComponentName(this, AdminReceiver.class); }

              private DevicePolicyManager dpm() {
                  return (DevicePolicyManager) getSystemService(DEVICE_POLICY_SERVICE);
              }

              private void render() {
                  root.removeAllViews();
                  root.addView(text("Site Guard", 28, true));
                  alarmStatus();
                  if (Store.armed(this)) renderLocked();
                  else renderSetup();
              }

              private void renderLocked() {
                  root.addView(text("Protection is ON.", 20, true));
                  root.addView(text("Blocked sites and apps are being closed. Removing this app needs the PIN.", 16, false));
                  root.addView(text(Schedule.isFreeDay(this)
                          ? "Today is a screen-time day. Blocking is paused (adult sites stay blocked)."
                          : "Screen-time days: the 2nd Saturday and the Sunday after it, every month.", 16, false));
                  root.addView(text(Usage.describe(this), 16, false));
                  if (!accessibilityOn()) {
                      root.addView(text("Warning: the accessibility service is OFF, so nothing is being blocked right now. Turn it back on.", 16, true));
                      root.addView(button("Open Accessibility settings", v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))));
                  }
                  root.addView(button("Phone keeps stopping Site Guard? Open app settings", v -> openAppInfo()));
                  final EditText in = new EditText(this);
                  in.setHint("PIN");
                  in.setInputType(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                  root.addView(in);
                  root.addView(button("Unlock", v -> {
                      int r = Store.check(this, in.getText().toString().trim());
                      if (r == 0) {
                          Store.setArmed(this, false);
                          render();
                      } else if (r == 2) {
                          Toast.makeText(this, "Too many wrong tries. Try again later.", Toast.LENGTH_LONG).show();
                      } else {
                          Toast.makeText(this, "Wrong PIN.", Toast.LENGTH_SHORT).show();
                      }
                  }));
              }

              private void renderSetup() {
                  if (!Store.hasPin(this)) {
                      root.addView(text("First make a random 8-digit PIN. It is shown once. After you activate protection it can never be shown again, and protection cannot be switched off without it.", 16, false));
                      root.addView(button("Generate PIN", v -> {
                          shownPin = Store.newPin(this);
                          render();
                      }));
                      return;
                  }
                  if (shownPin != null) {
                      root.addView(text("Your PIN (shown only now):", 16, false));
                      root.addView(text(shownPin, 44, true));
                  } else {
                      root.addView(text("A PIN is set but hidden. If you did not keep it and you want to, make a new one before activating.", 16, false));
                  }
                  root.addView(button("Make a new PIN", v -> {
                      shownPin = Store.newPin(this);
                      render();
                  }));

                  boolean acc = accessibilityOn();
                  boolean adm = dpm().isAdminActive(admin());

                  root.addView(text("1. Accessibility service: " + (acc ? "ON" : "OFF"), 18, true));
                  root.addView(button("Open Accessibility settings (find Site Guard, turn on)", v ->
                          startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))));

                  root.addView(text("2. Device admin: " + (adm ? "ON" : "OFF"), 18, true));
                  if (!adm) {
                      root.addView(button("Activate device admin", v -> {
                          Intent i = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                          i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin());
                          i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION,
                                  "Stops Site Guard from being uninstalled without its PIN.");
                          startActivity(i);
                      }));
                  } else {
                      root.addView(button("Remove device admin (needed before uninstalling)", v -> {
                          dpm().removeActiveAdmin(admin());
                          render();
                      }));
                  }

                  root.addView(text("3. Battery: allow Site Guard to run in the background", 18, true));
                  root.addView(button("Open battery settings", v ->
                          startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))));
                  root.addView(button("Open app settings (set battery to Unrestricted, allow auto-start)", v -> openAppInfo()));

                  root.addView(text("4. Activate", 18, true));
                  root.addView(button("Activate protection", v -> {
                      if (!accessibilityOn() || !dpm().isAdminActive(admin())) {
                          Toast.makeText(this, "Finish steps 1 and 2 first.", Toast.LENGTH_LONG).show();
                          return;
                      }
                      new AlertDialog.Builder(this)
                              .setTitle("Activate protection?")
                              .setMessage("After this the PIN is hidden for good. Make sure you are happy to lose the ability to switch this off.")
                              .setPositiveButton("Activate", (d, w) -> {
                                  Store.setArmed(this, true);
                                  shownPin = null;
                                  render();
                              })
                              .setNegativeButton("Not yet", null)
                              .show();
                  }));
              }
          }
          SGEOF
          cat > app/src/main/java/com/siteguard/GuardService.java <<'SGEOF'
          package com.siteguard;

          import android.accessibilityservice.AccessibilityService;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;

          public class GuardService extends AccessibilityService {

              // Streaming apps: closed straight away, matched by package id or by words in the app's name.
              private static final String[] APP_IDS = {
                  "com.netflix.mediaclient", "com.netflix.ninja", "com.amazon.avod.thirdpartyclient",
                  "com.disney.disneyplus", "com.hulu.plus", "com.wbd.stream", "com.hbo.hbonow",
                  "com.apple.atve.androidtv.appletv"
              };
              private static final String[] APP_WORDS = {
                  "netflix", "prime video", "disney", "hulu", "showmax", "iroko", "paramount",
                  "peacock", "tubi", "rakuten viki", "crunchyroll", "iqiyi", "wetv", "kisskh",
                  "bilibili", "apple tv"
              };
              private static final String[] BROWSER_IDS = {
                  "com.android.chrome", "com.huawei.browser", "org.mozilla.firefox", "org.mozilla.fenix",
                  "com.opera.browser", "com.opera.mini.native", "com.opera.gx", "com.microsoft.emmx",
                  "com.brave.browser", "com.duckduckgo.mobile.android", "com.sec.android.app.sbrowser",
                  "com.UCMobile.intl", "com.uc.browser.en", "mark.via.gp", "com.kiwibrowser.browser",
                  "com.android.browser", "com.vivaldi.browser", "com.google.android.googlequicksearchbox"
              };
              // TikTok and Instagram: only the names at the top of the screen and the search box are checked.
              private static final String[] SOCIAL_IDS = {
                  "com.zhiliaoapp.musically", "com.ss.android.ugc.trill", "com.zhiliaoapp.musically.go",
                  "com.instagram.android", "com.instagram.lite"
              };
              // Where browsers keep the address / search bar (appended to the browser's package id).
              private static final String[] BAR_IDS = {
                  "url_bar", "search_box_text", "mozac_browser_toolbar_url_view", "url_field",
                  "location_bar_edit_text", "omnibarTextInput", "url"
              };
              // Screens where the app's own name must never be visible once protection is on.
              private static final String[] SYSTEM_PARTS = {
                  "settings", "packageinstaller", "permissioncontroller", "systemmanager",
                  "securitycenter", "appmarket"
              };

              private final List<String> webWords = new ArrayList<>();   // blocklist.txt, paused on screen-time days
              private final List<String> alwaysWords = new ArrayList<>(); // blocklist.txt after #!always, never paused
              private final List<String> nameWords = new ArrayList<>();  // names.txt, matched anywhere
              private final Set<String> nameExact = new HashSet<>();     // names.txt, lines starting with =
              private final Map<String, String> labels = new HashMap<>();
              private final Handler h = new Handler(Looper.getMainLooper());
              private String myLabel = "site guard";

              // First unlock of the day shows the morning screen.
              private final BroadcastReceiver unlock = new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) {
                      if (Content.morningDue(GuardService.this)) {
                          Content.markMorning(GuardService.this);
                          MorningScreen.show(GuardService.this);
                      }
                  }
              };

              // event handling
              private String lastPkg = null;
              private boolean pending = false;
              private boolean pendingState = false;
              private int nullRetries = 0;
              private long lastToast = 0;

              // warning countdown
              private boolean warning = false;
              private boolean warnBrowser = false;
              private String warnPkg = null;
              private int secs = 0;
              private int stage = 0;
              private WindowManager wm = null;
              private TextView banner = null;

              private final Runnable check = new Runnable() {
                  @Override public void run() { runCheck(); }
              };
              // Counts the time spent in Instagram and TikTok while the screen is on.
              private long lastUse = 0;
              private final Runnable usageTick = new Runnable() {
                  @Override public void run() {
                      try {
                          long now = System.currentTimeMillis();
                          long dt = lastUse == 0 ? 0 : Math.min(now - lastUse, 10000);
                          lastUse = now;
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          if (dt > 0 && pm.isInteractive() && !Schedule.isFreeDay(GuardService.this)) {
                              AccessibilityNodeInfo root = getRootInActiveWindow();
                              CharSequence cp = root == null ? null : root.getPackageName();
                              if (cp != null && isSocial(cp.toString())) {
                                  Usage.add(GuardService.this, dt);
                                  if (Usage.exceeded(GuardService.this)) kick("Daily limit reached for Instagram and TikTok");
                              }
                          }
                      } catch (Exception ignored) { }
                      h.postDelayed(this, 5000);
                  }
              };

              private final Runnable tick = new Runnable() {
                  @Override public void run() { runTick(); }
              };

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  webWords.clear();
                  alwaysWords.clear();
                  nameWords.clear();
                  nameExact.clear();
                  loadList("blocklist.txt", webWords, null);
                  loadList("names.txt", nameWords, nameExact);
                  keepAlive();
                  try {
                      registerReceiver(unlock, new IntentFilter(Intent.ACTION_USER_PRESENT));
                  } catch (Exception ignored) { }
                  Scheduler.scheduleAll(this);
                  lastUse = 0;
                  h.removeCallbacks(usageTick);
                  h.postDelayed(usageTick, 5000);
              }

              @Override
              public void onDestroy() {
                  h.removeCallbacksAndMessages(null);
                  removeBanner();
                  try { unregisterReceiver(unlock); } catch (Exception ignored) { }
                  super.onDestroy();
              }

              private void loadList(String asset, List<String> words, Set<String> exact) {
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(getAssets().open(asset)))) {
                      String line;
                      boolean always = false;
                      while ((line = r.readLine()) != null) {
                          line = line.trim().toLowerCase(Locale.ROOT);
                          if (line.equals("#!always")) { always = true; continue; }
                          if (line.isEmpty() || line.startsWith("#")) continue;
                          if (exact != null && line.startsWith("=")) {
                              String e = line.substring(1).trim();
                              if (!e.isEmpty()) exact.add(e);
                          } else if (always && exact == null) {
                              alwaysWords.add(line);
                          } else {
                              words.add(line);
                          }
                      }
                  } catch (Exception ignored) { }
              }

              // A quiet ongoing notification makes the phone far less likely to stop this service.
              private void keepAlive() {
                  try {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      Notification.Builder b;
                      if (Build.VERSION.SDK_INT >= 26) {
                          nm.createNotificationChannel(new NotificationChannel("sg", "Site Guard", NotificationManager.IMPORTANCE_MIN));
                          b = new Notification.Builder(this, "sg");
                      } else {
                          b = new Notification.Builder(this);
                      }
                      b.setContentTitle("Site Guard is on")
                       .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                       .setOngoing(true);
                      startForeground(1, b.build());
                  } catch (Exception ignored) { }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e == null || e.getPackageName() == null) return;
                  String p = e.getPackageName().toString();
                  if (p.equals(getPackageName()) || p.equals("com.android.systemui")) return;
                  boolean stateChange = e.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED;

                  if (stateChange && !Schedule.isFreeDay(this) && isBlockedApp(p)) {
                      kick("App blocked");
                      return;
                  }

                  lastPkg = p;
                  if (stateChange) pendingState = true;
                  // Check at most every 150 ms, but never skip a check: the timer is not reset by new events.
                  if (!pending) {
                      pending = true;
                      h.postDelayed(check, 150);
                  }
              }

              private void runCheck() {
                  pending = false;
                  boolean state = pendingState;
                  pendingState = false;

                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) {
                      // Browsers often have no content for a moment while a page loads. Try again shortly.
                      if (nullRetries++ < 6) {
                          pending = true;
                          pendingState = pendingState || state;
                          h.postDelayed(check, 300);
                      }
                      return;
                  }
                  nullRetries = 0;

                  CharSequence cp = root.getPackageName();
                  if (cp == null) return;
                  String p = cp.toString();
                  if (p.equals(getPackageName()) || p.equals("com.android.systemui")) return;

                  boolean armed = Store.armed(this);
                  boolean sys = isSystem(p);

                  if (armed && (sys || state)) {
                      StringBuilder sb = new StringBuilder();
                      collect(root, sb, new int[]{0});
                      String text = sb.toString().toLowerCase(Locale.ROOT);
                      if (text.contains(myLabel) && (sys || text.contains("uninstall"))) {
                          kick("Protected");
                          return;
                      }
                  }

                  if (isBrowser(p)) {
                      if (browserHit(root, p)) startWarning(p, true);
                  } else if (isSocial(p)) {
                      if (!Schedule.isFreeDay(this) && Usage.exceeded(this)) {
                          kick("Daily limit reached for Instagram and TikTok");
                          return;
                      }
                      if (socialHit(root)) startWarning(p, false);
                  }
              }

              // ---------- what to look at ----------

              private boolean browserHit(AccessibilityNodeInfo root, String p) {
                  String bar = barText(root, p);
                  if (bar == null) return false;
                  return matches(bar, true);
              }

              private boolean socialHit(AccessibilityNodeInfo root) {
                  int top = (int) (getResources().getDisplayMetrics().heightPixels * 0.25f);
                  List<String> found = new ArrayList<>();
                  collectTop(root, found, new int[]{0}, top);
                  for (String s : found) if (matches(s, false)) return true;
                  return false;
              }

              private String barText(AccessibilityNodeInfo root, String p) {
                  for (String id : BAR_IDS) {
                      List<AccessibilityNodeInfo> list = root.findAccessibilityNodeInfosByViewId(p + ":id/" + id);
                      if (list == null) continue;
                      for (AccessibilityNodeInfo n : list) {
                          CharSequence t = n.getText();
                          if (t != null && t.length() > 0) return t.toString();
                      }
                  }
                  // Browser we do not know: use the first text box near the top of the screen.
                  int top = (int) (getResources().getDisplayMetrics().heightPixels * 0.3f);
                  return editText(root, new int[]{0}, top);
              }

              private String editText(AccessibilityNodeInfo n, int[] count, int maxTop) {
                  if (n == null || count[0]++ > 800) return null;
                  if (!n.isVisibleToUser()) return null;
                  CharSequence cls = n.getClassName();
                  if (cls != null && cls.toString().contains("EditText")) {
                      CharSequence t = n.getText();
                      Rect r = new Rect();
                      n.getBoundsInScreen(r);
                      if (t != null && t.length() > 0 && r.top < maxTop) return t.toString();
                  }
                  for (int i = 0; i < n.getChildCount(); i++) {
                      String s = editText(n.getChild(i), count, maxTop);
                      if (s != null) return s;
                  }
                  return null;
              }

              private void collectTop(AccessibilityNodeInfo n, List<String> out, int[] count, int maxTop) {
                  if (n == null || count[0]++ > 600) return;
                  if (!n.isVisibleToUser()) return;
                  Rect r = new Rect();
                  n.getBoundsInScreen(r);
                  if (r.top >= maxTop) return;
                  // Only small labels that sit fully inside the top part of the screen count.
                  if (r.bottom <= maxTop) {
                      CharSequence a = n.getText();
                      CharSequence b = n.getContentDescription();
                      if (a != null && a.length() < 200) out.add(a.toString());
                      if (b != null && b.length() < 200) out.add(b.toString());
                  }
                  for (int i = 0; i < n.getChildCount(); i++) collectTop(n.getChild(i), out, count, maxTop);
              }

              private boolean matches(String raw, boolean web) {
                  String t = raw.toLowerCase(Locale.ROOT).trim();
                  if (t.isEmpty()) return false;
                  for (String k : alwaysWords) if (t.contains(k)) return true;
                  // On screen-time days everything else is paused.
                  if (Schedule.isFreeDay(this)) return false;
                  String bare = t.startsWith("@") ? t.substring(1) : t;
                  if (nameExact.contains(t) || nameExact.contains(bare)) return true;
                  for (String k : nameWords) if (t.contains(k)) return true;
                  if (web) for (String k : webWords) if (t.contains(k)) return true;
                  return false;
              }

              // ---------- the 5 second warning ----------

              private void startWarning(String pkg, boolean browser) {
                  if (warning) return;
                  warning = true;
                  warnPkg = pkg;
                  warnBrowser = browser;
                  secs = 5;
                  stage = 0;
                  showBanner();
                  h.removeCallbacks(tick);
                  h.postDelayed(tick, 1000);
              }

              private boolean stillBlocked() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return true;
                  CharSequence cp = root.getPackageName();
                  if (cp == null) return true;
                  String p = cp.toString();
                  if (p.equals(getPackageName()) || p.equals("com.android.systemui")) return true;
                  if (!p.equals(warnPkg)) return false;
                  return warnBrowser ? browserHit(root, p) : socialHit(root);
              }

              private void runTick() {
                  if (!warning) return;
                  if (!stillBlocked()) {
                      stopWarning();
                      return;
                  }
                  secs--;
                  if (secs > 0) {
                      setBanner("Blocked. Close this page within " + secs + " seconds or Site Guard will take you out.");
                      h.postDelayed(tick, 1000);
                      return;
                  }
                  if (warnBrowser && stage == 0) {
                      stage = 1;
                      secs = 1;
                      setBanner("Going back...");
                      performGlobalAction(GLOBAL_ACTION_BACK);
                      h.postDelayed(tick, 1500);
                      return;
                  }
                  stopWarning();
                  kick("Blocked");
              }

              private void stopWarning() {
                  warning = false;
                  h.removeCallbacks(tick);
                  removeBanner();
              }

              private void showBanner() {
                  try {
                      wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      float d = getResources().getDisplayMetrics().density;
                      banner = new TextView(this);
                      banner.setTextColor(Color.WHITE);
                      banner.setBackgroundColor(0xEEB00020);
                      banner.setTextSize(16);
                      banner.setGravity(Gravity.CENTER);
                      banner.setPadding((int) (16 * d), (int) (40 * d), (int) (16 * d), (int) (14 * d));
                      banner.setText("Blocked. Close this page within 5 seconds or Site Guard will take you out.");
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP;
                      wm.addView(banner, lp);
                  } catch (Exception ex) {
                      banner = null;
                      Toast.makeText(this, "Blocked. Leave this page in 5 seconds.", Toast.LENGTH_LONG).show();
                  }
              }

              private void setBanner(String s) {
                  if (banner != null) banner.setText(s);
              }

              private void removeBanner() {
                  try {
                      if (wm != null && banner != null) wm.removeView(banner);
                  } catch (Exception ignored) { }
                  banner = null;
              }

              // ---------- helpers ----------

              private void kick(String msg) {
                  performGlobalAction(GLOBAL_ACTION_HOME);
                  long now = System.currentTimeMillis();
                  if (now - lastToast > 2500) {
                      lastToast = now;
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              public void onInterrupt() { }

              private void collect(AccessibilityNodeInfo n, StringBuilder sb, int[] count) {
                  if (n == null || count[0]++ > 1500) return;
                  CharSequence a = n.getText();
                  CharSequence b = n.getContentDescription();
                  if (a != null && a.length() < 500) sb.append(a).append('\n');
                  if (b != null && b.length() < 500) sb.append(b).append('\n');
                  for (int i = 0; i < n.getChildCount(); i++) collect(n.getChild(i), sb, count);
              }

              private String label(String p) {
                  String l = labels.get(p);
                  if (l == null) {
                      try {
                          PackageManager pm = getPackageManager();
                          l = pm.getApplicationLabel(pm.getApplicationInfo(p, 0)).toString().toLowerCase(Locale.ROOT);
                      } catch (Exception ex) {
                          l = "";
                      }
                      labels.put(p, l);
                  }
                  return l;
              }

              private boolean isBlockedApp(String p) {
                  for (String id : APP_IDS) if (p.equals(id)) return true;
                  String l = label(p);
                  for (String w : APP_WORDS) if (l.contains(w)) return true;
                  return false;
              }

              private boolean isBrowser(String p) {
                  for (String id : BROWSER_IDS) if (p.equals(id)) return true;
                  String l = label(p);
                  return l.contains("browser") || l.contains("chrome");
              }

              private boolean isSocial(String p) {
                  for (String id : SOCIAL_IDS) if (p.equals(id)) return true;
                  String l = label(p);
                  return l.contains("tiktok") || l.contains("instagram");
              }

              private boolean isSystem(String p) {
                  for (String s : SYSTEM_PARTS) if (p.contains(s)) return true;
                  return false;
              }
          }

          public class AlarmService extends Service {
              private MediaPlayer mp;
              private Ringtone ringtone;
              private PowerManager.WakeLock wl;
              private AudioManager audio;
              private final Handler h = new Handler(Looper.getMainLooper());

              private final Runnable watch = new Runnable() {
                  @Override public void run() {
                      maxVolume();
                      // If the sound died for any reason, start it again.
                      boolean playing = false;
                      try { playing = (mp != null && mp.isPlaying()) || (ringtone != null && ringtone.isPlaying()); } catch (Exception ignored) { }
                      if (!playing) startSound();
                      h.postDelayed(this, 3000);
                  }
              };

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  int kind = intent == null ? Scheduler.TAHAJJUD : intent.getIntExtra("kind", Scheduler.TAHAJJUD);
                  audio = (AudioManager) getSystemService(AUDIO_SERVICE);

                  // Keep the phone awake while ringing.
                  try {
                      if (wl == null) {
                          PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                          wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "siteguard:alarm");
                      }
                      if (!wl.isHeld()) wl.acquire(16 * 60 * 1000L);
                  } catch (Exception ignored) { }

                  try { showNotification(kind); } catch (Exception ignored) { }
                  maxVolume();
                  boolean playing = false;
                  try { playing = mp != null && mp.isPlaying(); } catch (Exception ignored) { }
                  if (!playing) startSound();
                  vibrate();

                  // Backup ring in 3 minutes. Tapping "I'm up" or snooze cancels it.
                  Scheduler.scheduleRetry(this, kind);

                  h.removeCallbacksAndMessages(null);
                  h.postDelayed(watch, 3000);
                  // Stop by itself after 15 minutes if nobody answers.
                  h.postDelayed(() -> stopSelf(), 15 * 60 * 1000L);
                  return START_NOT_STICKY;
              }

              private void maxVolume() {
                  try {
                      if (audio == null) return;
                      int max = audio.getStreamMaxVolume(AudioManager.STREAM_ALARM);
                      if (audio.getStreamVolume(AudioManager.STREAM_ALARM) < max) {
                          audio.setStreamVolume(AudioManager.STREAM_ALARM, max, 0);
                      }
                  } catch (Exception ignored) { }
              }

              private void vibrate() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      long[] pattern = {0, 800, 600};
                      if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createWaveform(pattern, 0));
                      else v.vibrate(pattern, 0);
                  } catch (Exception ignored) { }
              }

              private void showNotification(int kind) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("alarm", "Prayer alarms", NotificationManager.IMPORTANCE_HIGH);
                      ch.setSound(null, null);
                      nm.createNotificationChannel(ch);
                      b = new Notification.Builder(this, "alarm");
                  } else {
                      b = new Notification.Builder(this);
                  }
                  Intent open = new Intent(this, AlarmActivity.class)
                          .putExtra("kind", kind)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 7, open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  b.setContentTitle(kind == Scheduler.FAJR ? "Time to wake up for Fajr" : "Time for Tahajjud")
                   .setContentText("Tap to open")
                   .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                   .setCategory(Notification.CATEGORY_ALARM)
                   .setOngoing(true)
                   .setContentIntent(pi)
                   .setFullScreenIntent(pi, true);
                  startForeground(2, b.build());
                  try {
                      startActivity(open);
                  } catch (Exception ignored) { }
              }

              private AudioAttributes alarmAttrs() {
                  return new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build();
              }

              private void startSound() {
                  stopSound();
                  try {
                      audio.requestAudioFocus(null, AudioManager.STREAM_ALARM, AudioManager.AUDIOFOCUS_GAIN_TRANSIENT);
                  } catch (Exception ignored) { }
                  // 1) the adhan, 2) the phone's default alarm sound, 3) the phone's ringtone player.
                  if (playAdhan()) return;
                  if (playDefault()) return;
                  try {
                      ringtone = RingtoneManager.getRingtone(this, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM));
                      ringtone.setAudioAttributes(alarmAttrs());
                      ringtone.play();
                  } catch (Exception ignored) { }
              }

              private boolean playAdhan() {
                  int id = getResources().getIdentifier("adhan", "raw", getPackageName());
                  if (id == 0) return false;
                  try {
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(alarmAttrs());
                      AssetFileDescriptor afd = getResources().openRawResourceFd(id);
                      mp.setDataSource(afd.getFileDescriptor(), afd.getStartOffset(), afd.getLength());
                      afd.close();
                      mp.setLooping(true);
                      mp.setVolume(1f, 1f);
                      mp.prepare();
                      mp.start();
                      return true;
                  } catch (Exception e) {
                      releasePlayer();
                      return false;
                  }
              }

              private boolean playDefault() {
                  try {
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(alarmAttrs());
                      Uri u = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                      mp.setDataSource(this, u);
                      mp.setLooping(true);
                      mp.setVolume(1f, 1f);
                      mp.prepare();
                      mp.start();
                      return true;
                  } catch (Exception e) {
                      releasePlayer();
                      return false;
                  }
              }

              private void releasePlayer() {
                  if (mp != null) {
                      try { mp.stop(); } catch (Exception ignored) { }
                      try { mp.release(); } catch (Exception ignored) { }
                      mp = null;
                  }
              }

              private void stopSound() {
                  releasePlayer();
                  if (ringtone != null) {
                      try { ringtone.stop(); } catch (Exception ignored) { }
                      ringtone = null;
                  }
              }

              @Override
              public void onDestroy() {
                  h.removeCallbacksAndMessages(null);
                  stopSound();
                  try { ((Vibrator) getSystemService(VIBRATOR_SERVICE)).cancel(); } catch (Exception ignored) { }
                  try { audio.abandonAudioFocus(null); } catch (Exception ignored) { }
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Exception ignored) { }
                  super.onDestroy();
              }
          }

          package com.siteguard;

          import android.content.Context;
          import android.provider.Settings;

          import java.util.Calendar;

          final class Schedule {
              private Schedule() { }

              /** Screen-time days: the 2nd Saturday of each month and the Sunday after it. */
              static boolean isFreeDate(Calendar cal) {
                  int dow = cal.get(Calendar.DAY_OF_WEEK);
                  int dom = cal.get(Calendar.DAY_OF_MONTH);
                  if (dow == Calendar.SATURDAY && dom >= 8 && dom <= 14) return true;
                  return dow == Calendar.SUNDAY && dom >= 9 && dom <= 15;
              }

              static boolean isFreeDay(Context c) {
                  try {
                      // If the phone's date is set by hand, the date cannot be trusted, so no free day.
                      if (Settings.Global.getInt(c.getContentResolver(), Settings.Global.AUTO_TIME, 1) == 0) return false;
                  } catch (Exception ignored) { }
                  return isFreeDate(Calendar.getInstance());
              }
          }

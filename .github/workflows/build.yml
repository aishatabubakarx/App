          package com.siteguard;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.graphics.PixelFormat;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.Button;

          final class MorningScreen {
              private MorningScreen() { }

              private static View shown = null;

              static void show(final AccessibilityService svc) {
                  if (shown != null) return;
                  try {
                      final WindowManager wm = (WindowManager) svc.getSystemService(Context.WINDOW_SERVICE);
                      final Button b = new Button(svc);
                      b.setEnabled(false);
                      b.setText("Take a moment... (8)");
                      final View v = Content.screen(svc, Content.MORNING, b);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.OPAQUE);
                      wm.addView(v, lp);
                      shown = v;

                      final Handler h = new Handler(Looper.getMainLooper());
                      final int[] left = {8};
                      h.postDelayed(new Runnable() {
                          @Override public void run() {
                              left[0]--;
                              if (left[0] > 0) {
                                  b.setText("Take a moment... (" + left[0] + ")");
                                  h.postDelayed(this, 1000);
                              } else {
                                  b.setText("Continue");
                                  b.setEnabled(true);
                              }
                          }
                      }, 1000);
                      b.setOnClickListener(x -> {
                          try { wm.removeView(v); } catch (Exception ignored) { }
                          shown = null;
                      });
                  } catch (Exception e) {
                      shown = null;
                  }
              }
          }
